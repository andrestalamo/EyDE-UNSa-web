<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadística y Diseño Experimental - EyDE</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #173f32;
      background: #f7f4eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(760px, calc(100% - 3rem));
      padding: 3rem 0;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
    }
    p {
      margin: 0 0 2.5rem;
      color: #52645d;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    nav {
      display: grid;
      gap: 0.8rem;
    }
    a {
      padding: 1rem 1.15rem;
      border: 1px solid #c8d2cd;
      border-radius: 0.4rem;
      color: #173f32;
      background: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover,
    a:focus-visible {
      border-color: #2f6f55;
      background: #eef4f0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Estadística y Diseño Experimental - UNSa</h1>
    <p>Ingeniería Agronómica · Facultad de Ciencias Naturales · Universidad Nacional de Salta</p>
    <nav aria-label="Clases disponibles">
      <a href="clases/clase-01/">Clase 01 — Estadística descriptiva</a>
      <a href="clases/clase-02/">Clase 02 — Probabilidad</a>
      <a href="clases/clase-03/">Clase 03 — Distribuciones de probabilidad</a>
    </nav>
  </main>
</body>
</html>
